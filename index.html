<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRC CAFE - 晚餐与糖水预订</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-b from-amber-50/80 via-orange-50/30 to-amber-50/60 min-h-screen pb-12 select-none relative font-sans text-slate-800">

    <!-- Debug 状态提示条 -->
    <div id="debugBanner" class="hidden bg-red-600 text-white text-xs font-bold py-1.5 text-center shadow-md">
        🚨 DEBUG MODE 开启中：已绕过真实日期限制，仅根据 Excel / Google Sheet Flag 判定菜单显示 🚨
    </div>

    <div id="carouselContainer" class="relative w-full max-w-md mx-auto overflow-hidden rounded-b-3xl shadow-lg cursor-grab active:cursor-grabbing bg-white">
        <img id="carouselImage" src="cafe1.jpeg" 
             class="w-full h-auto block transition-opacity duration-500 opacity-100 pointer-events-none" 
             alt="GRC CAFE 展示">
        <div id="carouselDots" class="absolute top-3 right-3 flex space-x-1.5 z-20 bg-white/70 backdrop-blur-md px-2.5 py-1 rounded-full border border-white/50 shadow-sm">
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 -mt-0.5 relative z-10 space-y-5">
        <div class="bg-white rounded-2xl shadow-lg p-6 border border-amber-100/60 space-y-5">
            <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <div>
                    <span class="text-xs text-slate-400 block font-medium">菜单价格</span>
                    <span class="text-xs font-bold text-slate-800" id="priceHeader">加载中...</span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 block font-medium">截单规则</span>
                    <span id="deadlineText" class="text-xs font-semibold bg-amber-50 text-amber-800 border border-amber-200/60 px-2 py-0.5 rounded-lg">周四/周五 8PM 截单</span>
                </div>
            </div>

            <form id="orderForm" onsubmit="handleOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">您的名字 / 称呼 <span class="text-rose-500">*</span></label>
                    <input type="text" id="name" required placeholder="例如：Tan / Ah Beng" autocomplete="off"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-400/60 transition text-sm bg-slate-50/50 focus:bg-white">
                </div>

                <!-- 选餐区域：可多选全部 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">选择预订餐点 (可多选) <span class="text-rose-500">*</span></label>
                    <div class="space-y-3">
                        
                        <!-- 星期五餐点卡片 -->
                        <div id="cardFriday" class="p-3.5 rounded-xl border-2 border-slate-200 bg-slate-50/50 transition-all space-y-3">
                            <label class="flex items-start justify-between cursor-pointer">
                                <div class="flex items-center space-x-3">
                                    <input type="checkbox" id="chkFriMain" onchange="toggleCard('Fri')" class="w-5 h-5 text-amber-600 rounded border-slate-300 focus:ring-amber-500 mt-0.5">
                                    <div>
                                        <div id="txtFriTitle" class="text-sm font-bold text-slate-800">星期五 - 加载中...</div>
                                        <div id="txtFriPrice" class="text-xs font-medium text-amber-700">RM --.00 / 份</div>
                                    </div>
                                </div>
                            </label>
                            
                            <div id="qtyFriBox" class="hidden flex items-center justify-between pt-2 border-t border-amber-200/50">
                                <span class="text-xs font-bold text-slate-600">份数：</span>
                                <div class="flex items-center space-x-3">
                                    <button type="button" onclick="adjustQty('Fri', -1)" class="w-8 h-8 rounded-lg bg-white hover:bg-amber-50 text-amber-800 font-bold text-base flex items-center justify-center border border-amber-200 shadow-sm active:scale-95 transition">-</button>
                                    <input type="number" id="qtyFri" value="1" min="1" readonly class="w-12 text-center py-0.5 font-bold text-sm border border-slate-200 rounded-lg bg-white shadow-inner text-slate-800">
                                    <button type="button" onclick="adjustQty('Fri', 1)" class="w-8 h-8 rounded-lg bg-white hover:bg-amber-50 text-amber-800 font-bold text-base flex items-center justify-center border border-amber-200 shadow-sm active:scale-95 transition">+</button>
                                </div>
                            </div>
                        </div>

                        <!-- 星期六主餐卡片 -->
                        <div id="cardSaturday" class="p-3.5 rounded-xl border-2 border-slate-200 bg-slate-50/50 transition-all space-y-3">
                            <label class="flex items-start justify-between cursor-pointer">
                                <div class="flex items-center space-x-3">
                                    <input type="checkbox" id="chkSatMain" onchange="toggleCard('Sat')" class="w-5 h-5 text-amber-600 rounded border-slate-300 focus:ring-amber-500 mt-0.5">
                                    <div>
                                        <div id="txtSatTitle" class="text-sm font-bold text-slate-800">星期六 - 加载中...</div>
                                        <div id="txtSatPrice" class="text-xs font-medium text-amber-700">RM --.00 / 份</div>
                                    </div>
                                </div>
                            </label>

                            <div id="qtySatBox" class="hidden flex items-center justify-between pt-2 border-t border-amber-200/50">
                                <span class="text-xs font-bold text-slate-600">份数：</span>
                                <div class="flex items-center space-x-3">
                                    <button type="button" onclick="adjustQty('Sat', -1)" class="w-8 h-8 rounded-lg bg-white hover:bg-amber-50 text-amber-800 font-bold text-base flex items-center justify-center border border-amber-200 shadow-sm active:scale-95 transition">-</button>
                                    <input type="number" id="qtySat" value="1" min="1" readonly class="w-12 text-center py-0.5 font-bold text-sm border border-slate-200 rounded-lg bg-white shadow-inner text-slate-800">
                                    <button type="button" onclick="adjustQty('Sat', 1)" class="w-8 h-8 rounded-lg bg-white hover:bg-amber-50 text-amber-800 font-bold text-base flex items-center justify-center border border-amber-200 shadow-sm active:scale-95 transition">+</button>
                                </div>
                            </div>
                        </div>

                        <!-- 周六糖水卡片 -->
                        <div id="cardDessert" class="p-3.5 rounded-xl border-2 border-slate-200 bg-slate-50/50 transition-all space-y-3">
                            <label class="flex items-start justify-between cursor-pointer">
                                <div class="flex items-center space-x-3">
                                    <input type="checkbox" id="chkDessert" onchange="toggleCard('Dessert')" class="w-5 h-5 text-rose-600 rounded border-slate-300 focus:ring-rose-500 mt-0.5">
                                    <div>
                                        <div id="txtDessertTitle" class="text-sm font-bold text-slate-800">星期六 - 加载中...</div>
                                        <div class="flex items-center space-x-2 mt-0.5">
                                            <span id="txtDessertPrice" class="text-xs font-medium text-rose-600">RM --.00 / 份</span>
                                            <span id="badgeDessertLimit" class="text-[10px] bg-rose-100 text-rose-700 font-bold px-1.5 py-0.5 rounded-full">限量</span>
                                        </div>
                                    </div>
                                </div>
                            </label>

                            <div id="qtyDessertBox" class="hidden flex items-center justify-between pt-2 border-t border-rose-200/50">
                                <span class="text-xs font-bold text-slate-600">份数：</span>
                                <div class="flex items-center space-x-3">
                                    <button type="button" onclick="adjustQty('Dessert', -1)" class="w-8 h-8 rounded-lg bg-white hover:bg-rose-50 text-rose-800 font-bold text-base flex items-center justify-center border border-rose-200 shadow-sm active:scale-95 transition">-</button>
                                    <input type="number" id="qtyDessert" value="1" min="1" readonly class="w-12 text-center py-0.5 font-bold text-sm border border-slate-200 rounded-lg bg-white shadow-inner text-slate-800">
                                    <button type="button" onclick="adjustQty('Dessert', 1)" class="w-8 h-8 rounded-lg bg-white hover:bg-rose-50 text-rose-800 font-bold text-base flex items-center justify-center border border-rose-200 shadow-sm active:scale-95 transition">+</button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">特殊备注 (可选)</label>
                    <input type="text" id="notes" placeholder="如：少辣 / 不要葱 / 糖水要热" autocomplete="off"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-400/60 transition text-sm bg-slate-50/50 focus:bg-white">
                </div>

                <div class="pt-2">
                    <div class="flex justify-between items-center mb-3 px-1">
                        <span class="text-sm font-bold text-slate-600">预估总额：</span>
                        <span id="totalText" class="text-2xl font-black text-amber-600">RM 0.00</span>
                    </div>

                    <button type="submit" id="submitBtn" 
                            class="w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 active:scale-[0.98] text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-600/20 flex items-center justify-center space-x-2 transition-all">
                        <i class="fa-brands fa-whatsapp text-white text-2xl"></i>
                        <span>确认提交并发送至 WhatsApp</span>
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-2xl shadow-lg p-6 border border-amber-100/60 text-center space-y-4">
            <h2 class="text-lg font-bold text-slate-800 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-qrcode text-pink-600"></i>
                <span>DuitNow / Touch 'n Go 付款</span>
            </h2>
            <p class="text-xs text-slate-500">使用任何银行 App / TNG eWallet 扫描二维码付款：</p>
            
            <div class="relative w-56 h-56 mx-auto bg-amber-50/30 rounded-2xl border-2 border-amber-100 p-2.5 flex items-center justify-center shadow-sm">
                <img src="qrcode.jpeg" class="w-full h-full object-contain rounded-xl shadow-sm" alt="DuitNow 付款码">
            </div>

            <div class="bg-rose-50/80 p-3.5 rounded-xl border border-rose-100/80 shadow-sm">
                <p class="text-xs text-rose-500 font-medium">扫码后请手动输入转账金额：</p>
                <p id="qrAmountText" class="text-2xl font-black text-rose-600">RM 0.00</p>
            </div>

            <div class="space-y-2 pt-1">
                <button type="button" onclick="copyAmount()" id="copyAmountBtn" class="w-full bg-amber-50 hover:bg-amber-100/80 active:scale-[0.98] text-amber-900 text-xs font-bold py-3 rounded-xl border border-amber-200/60 flex items-center justify-center space-x-2 transition-all">
                    <i class="fa-regular fa-copy"></i>
                    <span id="copyAmountText">复制转账金额</span>
                </button>

                <button type="button" onclick="copyPhone()" id="copyPhoneBtn" class="w-full bg-amber-50 hover:bg-amber-100/80 active:scale-[0.98] text-amber-900 text-xs font-bold py-3 rounded-xl border border-amber-200/60 flex items-center justify-center space-x-2 transition-all">
                    <i class="fa-regular fa-copy"></i>
                    <span id="copyPhoneText">复制 DuitNow 手机号 (0162207137)</span>
                </button>
            </div>

            <p class="text-xs text-slate-400">💡 付款完成后，点击上方提交按钮跳转 WhatsApp 确认订单</p>
        </div>

        <p class="text-center text-xs text-slate-400 mt-4">提交后将自动跳转至 WhatsApp 发送订单凭证</p>
    </div>

    <script>
        const DEBUG_MODE = false; 

        let ENABLE_FRI_DINNER = true;
        let ENABLE_SAT_DINNER = true;
        let ENABLE_SAT_DESSERT = true;

        let FRI_MENU_NAME = "🍲 古早味酿豆腐";
        let SAT_MENU_NAME = "🍲 招牌卤肉饭";
        let SAT_DESSERT_NAME = "🥣 周六限定糖水";

        let FRI_MAIN_PRICE = 13;
        let SAT_MAIN_PRICE = 15;
        let DESSERT_PRICE = 5;    
        let SAT_DESSERT_LIMIT = 20;

        const MY_PHONE_NUMBER = "60162207137"; 
        const DUITNOW_PHONE = "0162207137";   
        
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-t99KLkdMEcFzto_gfkosudLT3ElFVOqndO3KHZImHgx71hUqr9CDNSRg2Km45-j9Mw/exec"; 

        const ALL_SLIDES = [
            { image: "cafe1.jpeg", isFriday: false, isSaturdayMain: false, isDessert: false },
            { image: "dish1.jpeg", isFriday: true,  isSaturdayMain: false, isDessert: false },
            { image: "dish2.jpeg", isFriday: false, isSaturdayMain: true,  isDessert: false },
            { image: "dish3.jpeg", isFriday: false, isSaturdayMain: false, isDessert: true }
        ];

        let SLIDES = [];
        let currentTotal = "0.00";
        let slideIndex = 0;
        let carouselTimer = null;

        let touchStartX = 0;
        let touchEndX = 0;

        function parseBool(val) {
            if (val === true || val === false) return val;
            if (typeof val === 'string') {
                const clean = val.trim().toUpperCase();
                return clean === 'TRUE' || clean === '开';
            }
            return false;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            if (DEBUG_MODE) {
                document.getElementById('debugBanner').classList.remove('hidden');
            }

            document.getElementById('copyPhoneText').innerText = `复制 DuitNow 手机号 (${DUITNOW_PHONE})`;
            
            await fetchRemoteConfig();
            updateCarouselSlides();
            setupMenuUI();
            
            startCarousel();
            initSwipeEvents();
        });

        async function fetchRemoteConfig() {
            if (!GOOGLE_SCRIPT_URL) return;
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                const config = await res.json();
                if (config && !config.error) {
                    ENABLE_FRI_DINNER = parseBool(config.ENABLE_FRI_DINNER);
                    ENABLE_SAT_DINNER = parseBool(config.ENABLE_SAT_DINNER);
                    ENABLE_SAT_DESSERT = parseBool(config.ENABLE_SAT_DESSERT);
                    
                    if (config.friMenuName) FRI_MENU_NAME = config.friMenuName;
                    if (config.satMenuName) SAT_MENU_NAME = config.satMenuName;
                    if (config.satDessertName) SAT_DESSERT_NAME = config.satDessertName;
                    
                    if (config.friMainPrice) FRI_MAIN_PRICE = Number(config.friMainPrice);
                    if (config.satMainPrice) SAT_MAIN_PRICE = Number(config.satMainPrice);
                    if (config.dessertPrice) DESSERT_PRICE = Number(config.dessertPrice);
                    if (config.satDessertLimit) SAT_DESSERT_LIMIT = Number(config.satDessertLimit);
                }
            } catch (err) {
                console.log("无法连接后台 API，使用默认配置", err);
            }
        }

        function updateCarouselSlides() {
            SLIDES = ALL_SLIDES.filter(slide => {
                if (slide.isFriday && !ENABLE_FRI_DINNER) return false;
                if (slide.isSaturdayMain && !ENABLE_SAT_DINNER) return false;
                if (slide.isDessert && !ENABLE_SAT_DESSERT) return false;
                return true;
            });

            if (SLIDES.length === 0) {
                SLIDES = [{ image: "cafe1.jpeg", isFriday: false, isSaturdayMain: false, isDessert: false }];
            }

            renderDots();
            showSlide(0);
        }

        function setupMenuUI() {
            const now = new Date();
            const currentDayOfWeek = now.getDay(); // 0 是周日, 1-6 是周一至周六
            
            // 计算本周一的距离 (若今天是周日，按-6计算到本周一)
            const distToMonday = currentDayOfWeek === 0 ? -6 : 1 - currentDayOfWeek;
            
            const thisMonday = new Date(now);
            thisMonday.setDate(now.getDate() + distToMonday);
            thisMonday.setHours(0, 0, 0, 0);

            // 计算最近的星期五(+4)和星期六(+5)
            let targetFriday = new Date(thisMonday);
            targetFriday.setDate(thisMonday.getDate() + 4);

            let targetSaturday = new Date(thisMonday);
            targetSaturday.setDate(thisMonday.getDate() + 5);

            // 如果今天是周日，自动计算下一周的星期五和星期六
            if (currentDayOfWeek === 0) {
                targetFriday.setDate(targetFriday.getDate() + 7);
                targetSaturday.setDate(targetSaturday.getDate() + 7);
            }

            const friDateStr = `${targetFriday.getMonth() + 1}月${targetFriday.getDate()}日`;
            const satDateStr = `${targetSaturday.getMonth() + 1}月${targetSaturday.getDate()}日`;

            // 设置标题与价格
            document.getElementById('txtFriTitle').innerText = `星期五 (${friDateStr}) - ${FRI_MENU_NAME}`;
            document.getElementById('txtFriPrice').innerText = `RM ${FRI_MAIN_PRICE}.00 / 份`;

            document.getElementById('txtSatTitle').innerText = `星期六 (${satDateStr}) - ${SAT_MENU_NAME}`;
            document.getElementById('txtSatPrice').innerText = `RM ${SAT_MAIN_PRICE}.00 / 份`;

            // 统一日期在前格式：星期六 (8月22日) - 糖水名称
            document.getElementById('txtDessertTitle').innerText = `星期六 (${satDateStr}) - ${SAT_DESSERT_NAME}`;
            document.getElementById('txtDessertPrice').innerText = `RM ${DESSERT_PRICE}.00 / 份`;
            document.getElementById('badgeDessertLimit').innerText = `限量 ${SAT_DESSERT_LIMIT} 份`;

            document.getElementById('priceHeader').innerHTML = `主餐 RM${FRI_MAIN_PRICE}/RM${SAT_MAIN_PRICE} | 糖水 RM${DESSERT_PRICE}`;

            // 控制全局卡片开关状态
            if (!ENABLE_FRI_DINNER) {
                document.getElementById('cardFriday').classList.add('hidden');
            }
            if (!ENABLE_SAT_DINNER) {
                document.getElementById('cardSaturday').classList.add('hidden');
            }
            if (!ENABLE_SAT_DESSERT) {
                document.getElementById('cardDessert').classList.add('hidden');
            }

            calculateTotal();
        }

        function toggleCard(type) {
            const chk = document.getElementById(`chk${type === 'Fri' ? 'FriMain' : type === 'Sat' ? 'SatMain' : 'Dessert'}`);
            const card = document.getElementById(`card${type === 'Fri' ? 'Friday' : type === 'Sat' ? 'Saturday' : 'Dessert'}`);
            const qtyBox = document.getElementById(`qty${type}Box`);

            if (chk.checked) {
                if (type === 'Dessert') {
                    card.className = "p-3.5 rounded-xl border-2 border-rose-500 bg-rose-50/60 shadow-sm transition-all space-y-3";
                } else {
                    card.className = "p-3.5 rounded-xl border-2 border-amber-500 bg-amber-50/60 shadow-sm transition-all space-y-3";
                }
                qtyBox.classList.remove('hidden');
            } else {
                card.className = "p-3.5 rounded-xl border-2 border-slate-200 bg-slate-50/50 transition-all space-y-3";
                qtyBox.classList.add('hidden');
            }
            calculateTotal();
        }

        function adjustQty(type, amount) {
            const input = document.getElementById(`qty${type}`);
            let val = parseInt(input.value) || 1;
            val += amount;
            if (val < 1) val = 1;
            
            if (type === 'Dessert' && val > SAT_DESSERT_LIMIT) {
                val = SAT_DESSERT_LIMIT;
            }
            
            input.value = val;
            calculateTotal();
        }

        function calculateTotal() {
            let total = 0;

            const friChecked = document.getElementById('chkFriMain').checked;
            const satChecked = document.getElementById('chkSatMain').checked;
            const dessertChecked = document.getElementById('chkDessert').checked;

            if (friChecked && ENABLE_FRI_DINNER) {
                const qty = parseInt(document.getElementById('qtyFri').value) || 1;
                total += qty * FRI_MAIN_PRICE;
            }

            if (satChecked && ENABLE_SAT_DINNER) {
                const qty = parseInt(document.getElementById('qtySat').value) || 1;
                total += qty * SAT_MAIN_PRICE;
            }

            if (dessertChecked && ENABLE_SAT_DESSERT) {
                const qty = parseInt(document.getElementById('qtyDessert').value) || 1;
                total += qty * DESSERT_PRICE;
            }

            currentTotal = total.toFixed(2);

            document.getElementById('totalText').innerText = `RM ${currentTotal}`;
            document.getElementById('qrAmountText').innerText = `RM ${currentTotal}`;
            document.getElementById('copyAmountText').innerText = `复制转账金额 (${currentTotal})`;
        }

        function renderDots() {
            const dotsContainer = document.getElementById('carouselDots');
            dotsContainer.innerHTML = SLIDES.map((_, i) => 
                `<button type="button" onclick="goToSlide(${i})" id="dot${i}" class="w-2 h-2 rounded-full ${i === 0 ? 'bg-amber-500' : 'bg-slate-300'} transition-all focus:outline-none"></button>`
            ).join('');
        }

        function startCarousel() {
            stopCarousel();
            if (SLIDES.length <= 1) return;
            carouselTimer = setInterval(() => {
                slideIndex = (slideIndex + 1) % SLIDES.length;
                showSlide(slideIndex);
            }, 9000);
        }

        function stopCarousel() {
            if (carouselTimer) clearInterval(carouselTimer);
        }

        function goToSlide(index) {
            slideIndex = index;
            showSlide(slideIndex);
            startCarousel();
        }

        function nextSlide() {
            slideIndex = (slideIndex + 1) % SLIDES.length;
            showSlide(slideIndex);
            startCarousel();
        }

        function showSlide(index) {
            if (!SLIDES[index]) return;
            const img = document.getElementById('carouselImage');
            img.style.opacity = '0.3';

            setTimeout(() => {
                const current = SLIDES[index];
                img.src = current.image;

                for (let i = 0; i < SLIDES.length; i++) {
                    const dot = document.getElementById(`dot${i}`);
                    if (dot) {
                        dot.className = (i === index) 
                            ? "w-2 h-2 rounded-full bg-amber-500 transition-all focus:outline-none" 
                            : "w-2 h-2 rounded-full bg-slate-300 transition-all focus:outline-none";
                    }
                }
                img.style.opacity = '1';
            }, 200);
        }

        function initSwipeEvents() {
            const container = document.getElementById('carouselContainer');

            container.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            container.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            let isDragging = false;
            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                touchStartX = e.screenX;
            });

            container.addEventListener('mouseup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                touchEndX = e.screenX;
                handleSwipe();
            });
        }

        function handleSwipe() {
            const threshold = 40;
            if (touchStartX - touchEndX > threshold) {
                nextSlide();
            } else if (touchEndX - touchStartX > threshold) {
                slideIndex = (slideIndex - 1 + SLIDES.length) % SLIDES.length;
                showSlide(slideIndex);
                startCarousel();
            }
        }

        function safeCopyText(text, successCallback) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(successCallback).catch(() => fallbackCopy(text, successCallback));
            } else {
                fallbackCopy(text, successCallback);
            }
        }

        function fallbackCopy(text, successCallback) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                successCallback();
            } catch (err) {
                alert("复制失败，请手动复制：" + text);
            }
            document.body.removeChild(textArea);
        }

        function copyAmount() {
            safeCopyText(currentTotal, () => {
                const span = document.getElementById('copyAmountText');
                const originalText = span.innerText;
                span.innerText = `✅ 已复制金额 RM ${currentTotal}！`;
                setTimeout(() => { span.innerText = originalText; }, 2500);
            });
        }

        function copyPhone() {
            safeCopyText(DUITNOW_PHONE, () => {
                const span = document.getElementById('copyPhoneText');
                const originalText = span.innerText;
                span.innerText = `✅ 已复制号码 ${DUITNOW_PHONE}！`;
                setTimeout(() => { span.innerText = originalText; }, 2500);
            });
        }

        async function handleOrder(event) {
            event.preventDefault();

            const friChecked = document.getElementById('chkFriMain').checked;
            const satChecked = document.getElementById('chkSatMain').checked;
            const dessertChecked = document.getElementById('chkDessert').checked;

            if (!friChecked && !satChecked && !dessertChecked) {
                alert("⚠️ 请至少勾选一项餐点（星期五主餐、星期六主餐或糖水）！");
                return;
            }

            const btn = document.getElementById('submitBtn');
            const originalBtnText = `<i class="fa-brands fa-whatsapp text-white text-2xl"></i><span>确认提交并发送至 WhatsApp</span>`;
            
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-white"></i><span>正在提交订单...</span>`;

            const name = document.getElementById('name').value.trim();
            const notes = document.getElementById('notes').value.trim() || '无';
            const total = currentTotal;

            let selectedItems = [];
            
            const payload = { 
                timestamp: new Date().toLocaleString("zh-CN", { timeZone: "Asia/Kuala_Lumpur" }),
                name: name, 
                notes: notes,
                friOrder: null,
                satOrder: null,
                dessertOrder: null
            };

            if (friChecked && ENABLE_FRI_DINNER) {
                const q = parseInt(document.getElementById('qtyFri').value) || 1;
                const subtotal = q * FRI_MAIN_PRICE;
                selectedItems.push(`星期五 ${FRI_MENU_NAME} x ${q}份`);
                payload.friOrder = {
                    checked: true,
                    detail: FRI_MENU_NAME,
                    qty: q,
                    subtotal: subtotal
                };
            }

            if (satChecked && ENABLE_SAT_DINNER) {
                const q = parseInt(document.getElementById('qtySat').value) || 1;
                const subtotal = q * SAT_MAIN_PRICE;
                selectedItems.push(`星期六 ${SAT_MENU_NAME} x ${q}份`);
                payload.satOrder = {
                    checked: true,
                    detail: SAT_MENU_NAME,
                    qty: q,
                    subtotal: subtotal
                };
            }

            if (dessertChecked && ENABLE_SAT_DESSERT) {
                const q = parseInt(document.getElementById('qtyDessert').value) || 1;
                const subtotal = q * DESSERT_PRICE;
                selectedItems.push(`星期六 ${SAT_DESSERT_NAME} x ${q}份`);
                payload.dessertOrder = {
                    checked: true,
                    detail: SAT_DESSERT_NAME,
                    qty: q,
                    subtotal: subtotal
                };
            }

            if (GOOGLE_SCRIPT_URL) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                } catch (e) {
                    console.log("Sheet 请求超时或跳过:", e);
                } finally {
                    clearTimeout(timeoutId);
                }
            }

            let waMessage = `🛒 *【晚餐/糖水预订订单】*%0A` +
                            `--------------------------------%0A` +
                            `👤 *名字*：${encodeURIComponent(name)}%0A` +
                            `🍱 *已选餐点*：%0A`;

            selectedItems.forEach(item => {
                waMessage += `• ${encodeURIComponent(item)}%0A`;
            });

            waMessage += `💰 *总计*：RM ${total}%0A` +
                         `📝 *备注*：${encodeURIComponent(notes)}%0A` +
                         `--------------------------------%0A` +
                         `已下单，已按照 RM ${total} 完成转账/准备付款，请查收！`;

            const waUrl = `https://wa.me/${MY_PHONE_NUMBER}?text=${waMessage}`;

            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = originalBtnText;
                window.open(waUrl, '_blank');
            }, 300);
        }
    </script>
</body>
