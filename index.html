<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周五/周六晚餐预订</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <!-- 顶部 Banner 照片 -->
    <div class="relative h-60 w-full max-w-md mx-auto">
        <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80" 
             class="w-full h-full object-cover rounded-b-3xl shadow-md" alt="晚餐美食">
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent rounded-b-3xl"></div>
        <div class="absolute bottom-4 left-5 right-5 text-white">
            <span class="bg-amber-500 text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wide">每周美食</span>
            <h1 class="text-2xl font-extrabold mt-1">周五汉堡 / 周六卤肉饭</h1>
            <p class="text-slate-200 text-sm mt-0.5">RM 13.00 / 份，请提前预订</p>
        </div>
    </div>

    <!-- 表单与付款卡片容器 -->
    <div class="max-w-md mx-auto px-4 -mt-4 relative z-10 space-y-5">
        
        <!-- 1. 表单卡片 -->
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100 space-y-5">
            
            <!-- 价格与截单说明 -->
            <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <div>
                    <span class="text-xs text-slate-400 block">单价</span>
                    <span class="text-2xl font-black text-rose-600">RM 13.00 <span class="text-xs font-normal text-slate-500">/ 份</span></span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 block">截单时间</span>
                    <span class="text-xs font-semibold bg-slate-100 text-slate-700 px-2 py-1 rounded-md">每周四 8:00 PM</span>
                </div>
            </div>

            <!-- 表单输入区 -->
            <form id="orderForm" onsubmit="handleOrder(event)" class="space-y-4">
                
                <!-- 姓名 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">您的名字 / 称呼 <span class="text-rose-500">*</span></label>
                    <input type="text" id="name" required placeholder="例如：Tan / Ah Beng" 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                </div>

                <!-- 预订日期（改变选项时会自动更新对应的餐点名称） -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">预订用餐日期 <span class="text-rose-500">*</span></label>
                    <select id="day" onchange="updateMenuInfo()" required class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition font-bold text-slate-800">
                        <option value="星期五">星期五晚餐（🍔 特制汉堡）</option>
                        <option value="星期六">星期六晚餐（🍲 招牌卤肉饭）</option>
                    </select>
                </div>

                <!-- 当前餐点提示卡片 -->
                <div class="bg-amber-50 border border-amber-200/60 rounded-xl p-3 flex items-center space-x-3">
                    <div class="text-2xl" id="menuIcon">🍔</div>
                    <div>
                        <p class="text-xs text-amber-700 font-medium">所选餐点：</p>
                        <p class="text-sm font-bold text-amber-900" id="menuText">特制汉堡 (RM 13.00 / 份)</p>
                    </div>
                </div>

                <!-- 份数加减器 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">预订份数 <span class="text-rose-500">*</span></label>
                    <div class="flex items-center space-x-3">
                        <button type="button" onclick="adjustQty(-1)" class="w-12 h-12 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xl flex items-center justify-center border border-slate-200">-</button>
                        <input type="number" id="qty" value="1" min="1" readonly class="w-full text-center py-3 font-bold text-lg border border-slate-200 rounded-xl bg-slate-50">
                        <button type="button" onclick="adjustQty(1)" class="w-12 h-12 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xl flex items-center justify-center border border-slate-200">+</button>
                    </div>
                </div>

                <!-- 备注 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">特殊备注 (可选)</label>
                    <input type="text" id="notes" placeholder="如：少辣 / 不要葱 / 不要洋葱" 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                </div>

                <!-- 总价预览与提交按钮 -->
                <div class="pt-2">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-sm font-bold text-slate-600">预估总额：</span>
                        <span id="totalText" class="text-xl font-extrabold text-emerald-600">RM 13.00</span>
                    </div>

                    <button type="submit" id="submitBtn" 
                            class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-[0.99] text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-500/30 flex items-center justify-center space-x-2 transition">
                        <i class="fa-brands fa-whatsapp text-xl"></i>
                        <span>确认提交并发送至 WhatsApp</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- 2. DuitNow 付款卡片 -->
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100 text-center space-y-4">
            <h2 class="text-lg font-bold text-slate-800 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-qrcode text-pink-600"></i>
                <span>DuitNow / Touch 'n Go 付款</span>
            </h2>
            <p class="text-xs text-slate-500">使用任何银行 App / TNG eWallet 扫描二维码付款：</p>
            
            <!-- 💡 这里已设置为 qr.jpeg -->
            <div class="relative w-56 h-56 mx-auto bg-slate-50 rounded-xl border-2 border-slate-200 p-2 flex items-center justify-center">
                <img src="qr.jpeg" class="w-full h-full object-contain rounded-lg shadow-sm" alt="DuitNow 付款码">
            </div>

            <!-- 动态提示转账金额 -->
            <div class="bg-rose-50 p-3 rounded-xl border border-rose-100">
                <p class="text-xs text-rose-500 font-medium">扫码后请手动输入转账金额：</p>
                <p id="qrAmountText" class="text-2xl font-black text-rose-600">RM 13.00</p>
            </div>

            <!-- 手机端辅助快捷功能 -->
            <div class="space-y-2 pt-1">
                <!-- 一键复制金额 -->
                <button type="button" onclick="copyAmount()" id="copyAmountBtn" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-3 rounded-xl border border-slate-200 flex items-center justify-center space-x-2 transition">
                    <i class="fa-regular fa-copy"></i>
                    <span id="copyAmountText">复制转账金额 (13.00)</span>
                </button>

                <!-- 一键复制 DuitNow 手机号 -->
                <button type="button" onclick="copyPhone()" id="copyPhoneBtn" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-3 rounded-xl border border-slate-200 flex items-center justify-center space-x-2 transition">
                    <i class="fa-regular fa-copy"></i>
                    <span id="copyPhoneText">复制 DuitNow 手机号 (012-3456789)</span>
                </button>
            </div>

            <p class="text-xs text-slate-400">💡 付款完成后，点击上方绿按钮跳转 WhatsApp 确认订单</p>
        </div>

        <p class="text-center text-xs text-slate-400 mt-4">提交后将自动跳转至 WhatsApp 发送订单凭证</p>
    </div>

    <script>
        // ==================== 💡 必须修改的配置项 ====================
        const PRICE_PER_UNIT = 13; // 单价 RM 13.00
        const MY_PHONE_NUMBER = "60145952975"; // 💡 替换为你的 WhatsApp 电话（加国家码 60，不要加 + 号）
        const DUITNOW_PHONE = "0162207137"; // 💡 替换为你的 DuitNow 绑定的手机号码
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwb8DekyobGj28he2BCQhcyHtqiN_vJvC8YvTNkuM4Wr-oi8PBdJ50PCy5abuwTvcujMg/exec"; // 💡 粘贴你的 Google Apps Script URL
        // ============================================================

        let currentTotalStr = "13.00";

        // 初始化
        document.getElementById('copyPhoneText').innerText = `复制 DuitNow 手机号 (${DUITNOW_PHONE})`;

        // 根据选择的日期更新菜单提示
        function updateMenuInfo() {
            const day = document.getElementById('day').value;
            const menuIcon = document.getElementById('menuIcon');
            const menuText = document.getElementById('menuText');

            if (day === "星期五") {
                menuIcon.innerText = "🍔";
                menuText.innerText = "特制汉堡 (RM 13.00 / 份)";
            } else {
                menuIcon.innerText = "🍲";
                menuText.innerText = "招牌卤肉饭 (RM 13.00 / 份)";
            }
        }

        // 数量加减与金额计算
        function adjustQty(amount) {
            const qtyInput = document.getElementById('qty');
            let current = parseInt(qtyInput.value) || 1;
            current += amount;
            if (current < 1) current = 1;
            qtyInput.value = current;

            // 计算总金额
            currentTotalStr = (current * PRICE_PER_UNIT).toFixed(2);
            
            // 实时更新显示
            document.getElementById('totalText').innerText = `RM ${currentTotalStr}`;
            document.getElementById('qrAmountText').innerText = `RM ${currentTotalStr}`;
            document.getElementById('copyAmountText').innerText = `复制转账金额 (${currentTotalStr})`;
        }

        // 复制金额
        function copyAmount() {
            navigator.clipboard.writeText(currentTotalStr);
            const span = document.getElementById('copyAmountText');
            const originalText = span.innerText;
            span.innerText = `✅ 已复制金额 RM ${currentTotalStr}！`;
            setTimeout(() => { span.innerText = originalText; }, 2500);
        }

        // 复制手机号
        function copyPhone() {
            navigator.clipboard.writeText(DUITNOW_PHONE);
            const span = document.getElementById('copyPhoneText');
            const originalText = span.innerText;
            span.innerText = `✅ 已复制号码 ${DUITNOW_PHONE}！`;
            setTimeout(() => { span.innerText = originalText; }, 2500);
        }

        // 提交订单
        async function handleOrder(event) {
            event.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span>正在提交订单...</span>`;

            const name = document.getElementById('name').value;
            const day = document.getElementById('day').value;
            const qty = document.getElementById('qty').value;
            const notes = document.getElementById('notes').value || '无';
            const total = currentTotalStr;

            // 根据日期决定餐点名称
            const dishName = (day === "星期五") ? "特制汉堡" : "招牌卤肉饭";

            const payload = { name, day, dish: dishName, qty, total, notes };

            // 1. 静默写入后台 Google Sheets
            if (GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes("YOUR_GOOGLE")) {
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) {
                    console.log("Sheet error:", e);
                }
            }

            // 2. 拼接 WhatsApp 格式化消息
            const waMessage = `🛒 *【晚餐预订订单】*%0A` +
                              `--------------------------------%0A` +
                              `👤 *名字*：${name}%0A` +
                              `📅 *用餐日期*：${day}%0A` +
                              `🍲 *餐点*：${dishName} x ${qty} 份%0A` +
                              `💰 *总计*：RM ${total}%0A` +
                              `📝 *备注*：${notes}%0A` +
                              `--------------------------------%0A` +
                              `已下单，已按照 RM ${total} 完成转账/准备付款，请查收！`;

            // 3. 跳转至 WhatsApp
            window.location.href = `https://wa.me/${MY_PHONE_NUMBER}?text=${waMessage}`;
        }
    </script>
</body>
</html>
