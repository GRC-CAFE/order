<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRC CAFE - 晚餐与糖水预订</title>
    <!-- 引入 Tailwind CSS 与 FontAwesome Icon -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .banner-contain {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-amber-50/80 via-orange-50/30 to-amber-50/60 min-h-screen pb-12 select-none relative font-sans text-slate-800">

    <!-- 顶部 Banner 区域 -->
    <div id="carouselContainer" class="relative w-full max-w-md mx-auto overflow-hidden rounded-b-3xl shadow-lg cursor-grab active:cursor-grabbing bg-white">
        <!-- 动态轮播图片 -->
        <img id="carouselImage" src="cafe1.jpeg" 
             class="w-full h-auto block transition-opacity duration-500 opacity-100 pointer-events-none" 
             alt="GRC CAFE 展示">

        <!-- 动态指示点 -->
        <div id="carouselDots" class="absolute top-3 right-3 flex space-x-1.5 z-20 bg-white/70 backdrop-blur-md px-2.5 py-1 rounded-full border border-white/50 shadow-sm">
        </div>
    </div>

    <!-- 表单与付款卡片容器 -->
    <div class="max-w-md mx-auto px-4 -mt-0.5 relative z-10 space-y-5">
        
        <!-- 1. 表单卡片 -->
        <div class="bg-white rounded-2xl shadow-lg p-6 border border-amber-100/60 space-y-5">
            
            <!-- 菜单价格与截单说明 -->
            <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <div>
                    <span class="text-xs text-slate-400 block font-medium">菜单价格</span>
                    <span class="text-sm font-bold text-slate-800" id="priceHeader">加载中...</span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 block font-medium">截单规则</span>
                    <span id="deadlineText" class="text-xs font-semibold bg-amber-50 text-amber-800 border border-amber-200/60 px-2.5 py-1 rounded-lg">预订至 8月13号 8PM 截单</span>
                </div>
            </div>

            <!-- 表单输入区 -->
            <form id="orderForm" onsubmit="handleOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">您的名字 / 称呼 <span class="text-rose-500">*</span></label>
                    <input type="text" id="name" required placeholder="例如：Tan / Ah Beng" autocomplete="off"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-400/60 transition text-sm bg-slate-50/50 focus:bg-white">
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">预订用餐日期 <span class="text-rose-500">*</span></label>
                    <select id="day" onchange="updateMenuInfo()" required class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-400/60 transition font-bold text-slate-800 text-sm">
                        <option value="星期五" id="optFriday">星期五 - 加载中...</option>
                        <option value="星期六" id="optSaturday">星期六 - 加载中...</option>
                    </select>
                </div>

                <!-- 主餐选择区 -->
                <div id="mainDishSection" class="bg-amber-50/80 border border-amber-200/80 rounded-2xl p-4 space-y-3 transition-all">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="text-2xl" id="menuIcon">🍲</span>
                            <div>
                                <p class="text-xs text-amber-800 font-medium">主餐菜单：</p>
                                <p class="text-sm font-bold text-amber-950" id="menuText">加载中...</p>
                            </div>
                        </div>
                        <label id="mainDishToggle" class="hidden text-xs font-bold text-slate-600 flex items-center cursor-pointer bg-white px-2.5 py-1.5 rounded-lg border border-amber-200 shadow-sm">
                            <input type="checkbox" id="wantMainDish" checked onchange="toggleMainDish()" class="w-4 h-4 text-amber-600 rounded border-slate-300 focus:ring-amber-500 mr-1.5">
                            订购主餐
                        </label>
                    </div>

                    <div id="mainQtyContainer" class="flex items-center justify-between pt-1">
                        <span class="text-xs font-bold text-slate-600">主餐份数：</span>
                        <div class="flex items-center space-x-3">
                            <button type="button" onclick="adjustQty(-1)" class="w-9 h-9 rounded-xl bg-white hover:bg-amber-50 text-amber-800 font-bold text-lg flex items-center justify-center border border-amber-200 shadow-sm active:scale-95 transition">-</button>
                            <input type="number" id="qty" value="1" min="1" readonly class="w-14 text-center py-1 font-bold text-base border border-slate-200 rounded-xl bg-white shadow-inner text-slate-800">
                            <button type="button" onclick="adjustQty(1)" class="w-9 h-9 rounded-xl bg-white hover:bg-amber-50 text-amber-800 font-bold text-lg flex items-center justify-center border border-amber-200 shadow-sm active:scale-95 transition">+</button>
                        </div>
                    </div>
                </div>

                <!-- 糖水选择区 -->
                <div id="dessertSection" class="hidden bg-rose-50/80 border border-rose-200/80 rounded-2xl p-4 space-y-3 transition-all">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <span class="text-xl">🥣</span>
                            <span class="text-sm font-bold text-rose-900" id="dessertTitleText">周六限定糖水</span>
                        </div>
                        <span class="text-xs bg-rose-200/80 text-rose-800 font-bold px-2 py-0.5 rounded-full">限量 20 份</span>
                    </div>
                    
                    <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-rose-100 shadow-sm">
                        <label for="wantDessert" class="text-xs font-bold text-slate-700 flex items-center cursor-pointer">
                            <input type="checkbox" id="wantDessert" onchange="toggleDessertQty()" class="w-4 h-4 text-amber-600 rounded border-slate-300 focus:ring-amber-500 mr-2">
                            订购周六糖水
                        </label>
                        <div class="text-xs font-black text-rose-600" id="dessertUnitPriceText">+ RM 5.00 / 份</div>
                    </div>

                    <div id="dessertQtyContainer" class="hidden flex items-center justify-between pt-1">
                        <span class="text-xs font-bold text-slate-600">糖水份数：</span>
                        <div class="flex items-center space-x-2">
                            <button type="button" onclick="adjustDessertQty(-1)" class="w-8 h-8 rounded-lg bg-white border border-rose-200 font-bold text-sm text-rose-800 shadow-sm active:scale-95 transition">-</button>
                            <input type="number" id="dessertQty" value="1" min="1" max="20" readonly class="w-12 text-center text-sm font-bold bg-white border border-slate-200 rounded-lg py-1 text-slate-800">
                            <button type="button" onclick="adjustDessertQty(1)" class="w-8 h-8 rounded-lg bg-white border border-rose-200 font-bold text-sm text-rose-800 shadow-sm active:scale-95 transition">+</button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">特殊备注 (可选)</label>
                    <input type="text" id="notes" placeholder="如：少辣 / 不要葱 / 糖水要热" autocomplete="off"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-400/60 transition text-sm bg-slate-50/50 focus:bg-white">
                </div>

                <div class="pt-2">
                    <div class="flex justify-between items-center mb-3 px-1">
                        <span class="text-sm font-bold text-slate-600">预估总额：</span>
                        <span id="totalText" class="text-2xl font-black text-amber-600">RM 0.00</span>
                    </div>

                    <!-- WhatsApp 提交按钮 -->
                    <button type="submit" id="submitBtn" 
                            class="w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 active:scale-[0.98] text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-600/20 flex items-center justify-center space-x-2 transition-all">
                        <i class="fa-brands fa-whatsapp text-white text-2xl"></i>
                        <span>确认提交并发送至 WhatsApp</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- 2. DuitNow 付款卡片 -->
        <div class="bg-white rounded-2xl shadow-lg p-6 border border-amber-100/60 text-center space-y-4">
            <h2 class="text-lg font-bold text-slate-800 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-qrcode text-pink-600"></i>
                <span>DuitNow / Touch 'n Go 付款</span>
            </h2>
            <p class="text-xs text-slate-500">使用任何银行 App / TNG eWallet 扫描二维码付款：</p>
            
            <div class="relative w-56 h-56 mx-auto bg-amber-50/30 rounded-2xl border-2 border-amber-100 p-2.5 flex items-center justify-center shadow-sm">
                <img src="qrcode.jpeg" class="w-full h-full object-contain rounded-xl shadow-sm" alt="DuitNow 付款码">
            </div>

            <div class="bg-rose-50/80 p-3.5 rounded-xl border border-rose-100/80 shadow-sm">
                <p class="text-xs text-rose-500 font-medium">扫码后请手动输入转账金额：</p>
                <p id="qrAmountText" class="text-2xl font-black text-rose-600">RM 0.00</p>
            </div>

            <div class="space-y-2 pt-1">
                <button type="button" onclick="copyAmount()" id="copyAmountBtn" class="w-full bg-amber-50 hover:bg-amber-100/80 active:scale-[0.98] text-amber-900 text-xs font-bold py-3 rounded-xl border border-amber-200/60 flex items-center justify-center space-x-2 transition-all">
                    <i class="fa-regular fa-copy"></i>
                    <span id="copyAmountText">复制转账金额</span>
                </button>

                <button type="button" onclick="copyPhone()" id="copyPhoneBtn" class="w-full bg-amber-50 hover:bg-amber-100/80 active:scale-[0.98] text-amber-900 text-xs font-bold py-3 rounded-xl border border-amber-200/60 flex items-center justify-center space-x-2 transition-all">
                    <i class="fa-regular fa-copy"></i>
                    <span id="copyPhoneText">复制 DuitNow 手机号 (0162207137)</span>
                </button>
            </div>

            <p class="text-xs text-slate-400">💡 付款完成后，点击上方提交按钮跳转 WhatsApp 确认订单</p>
        </div>

        <p class="text-center text-xs text-slate-400 mt-4">提交后将自动跳转至 WhatsApp 发送订单凭证</p>
    </div>

    <script>
        // 默认离线配置
        let ENABLE_FRI_DINNER = true;
        let ENABLE_SAT_DINNER = true;
        let ENABLE_SAT_DESSERT = true;

        let FRI_MENU_NAME = "🍲 古早味酿豆腐";
        let SAT_MENU_NAME = "🍲 招牌卤肉饭";
        let SAT_DESSERT_NAME = "🥣 周六限定糖水";

        let FRI_MAIN_PRICE = 13;
        let SAT_MAIN_PRICE = 13;
        let DESSERT_PRICE = 5;    

        const MY_PHONE_NUMBER = "60162207137"; 
        const DUITNOW_PHONE = "0162207137";   
        
        // 已更新为你最新的 Google Apps Script API 链接
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSG41CxGsWOn_nhS5R5YSPtaNcJH_FmpF75HCPUS2jrpCFj350oD67Tq1lWge9oSNbXA/exec"; 

        const ALL_SLIDES = [
            { image: "cafe1.jpeg", isSaturday: false },
            { image: "dish1.jpeg", isSaturday: false },
            { image: "dish2.jpeg", isSaturday: true },
            { image: "dish3.jpeg", isSaturday: true }
        ];

        let SLIDES = ALL_SLIDES;
        let currentTotal = 0;
        let slideIndex = 0;
        let carouselTimer = null;

        let touchStartX = 0;
        let touchEndX = 0;

        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('copyPhoneText').innerText = `复制 DuitNow 手机号 (${DUITNOW_PHONE})`;
            
            await fetchRemoteConfig();

            SLIDES = (ENABLE_SAT_DINNER || ENABLE_SAT_DESSERT) 
                ? ALL_SLIDES 
                : ALL_SLIDES.filter(slide => !slide.isSaturday);

            renderDots();
            checkCurrentDayAndDisable();
            updatePriceHeader();
            updateMenuInfo();
            startCarousel();
            initSwipeEvents();
        });

        async function fetchRemoteConfig() {
            if (!GOOGLE_SCRIPT_URL) return;
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                const config = await res.json();
                if (config && !config.error) {
                    if (config.ENABLE_FRI_DINNER !== undefined) ENABLE_FRI_DINNER = config.ENABLE_FRI_DINNER;
                    if (config.ENABLE_SAT_DINNER !== undefined) ENABLE_SAT_DINNER = config.ENABLE_SAT_DINNER;
                    if (config.ENABLE_SAT_DESSERT !== undefined) ENABLE_SAT_DESSERT = config.ENABLE_SAT_DESSERT;
                    
                    if (config.friMenuName) FRI_MENU_NAME = config.friMenuName;
                    if (config.satMenuName) SAT_MENU_NAME = config.satMenuName;
                    if (config.satDessertName) SAT_DESSERT_NAME = config.satDessertName;
                    
                    if (config.friMainPrice) FRI_MAIN_PRICE = Number(config.friMainPrice);
                    if (config.satMainPrice) SAT_MAIN_PRICE = Number(config.satMainPrice);
                    if (config.dessertPrice) DESSERT_PRICE = Number(config.dessertPrice);
                }
            } catch (err) {
                console.log("无法连接后台 API，降级使用本地默认配置", err);
            }
        }

        function updatePriceHeader() {
            const priceHeader = document.getElementById('priceHeader');
            let items = [];
            
            if (ENABLE_FRI_DINNER && ENABLE_SAT_DINNER && FRI_MAIN_PRICE === SAT_MAIN_PRICE) {
                items.push(`主餐 <span class="text-amber-600">RM ${FRI_MAIN_PRICE}</span>`);
            } else {
                if (ENABLE_FRI_DINNER) items.push(`五主餐 <span class="text-amber-600">RM ${FRI_MAIN_PRICE}</span>`);
                if (ENABLE_SAT_DINNER) items.push(`六主餐 <span class="text-amber-600">RM ${SAT_MAIN_PRICE}</span>`);
            }

            if (ENABLE_SAT_DESSERT) {
                items.push(`糖水 <span class="text-amber-600">RM ${DESSERT_PRICE}</span>`);
            }
            
            if (items.length > 0) {
                priceHeader.innerHTML = items.join(' | ');
            } else {
                priceHeader.innerHTML = `<span class="text-rose-500">暂停预订</span>`;
            }
        }

        function renderDots() {
            const dotsContainer = document.getElementById('carouselDots');
            dotsContainer.innerHTML = SLIDES.map((_, i) => 
                `<button type="button" onclick="goToSlide(${i})" id="dot${i}" class="w-2 h-2 rounded-full ${i === 0 ? 'bg-amber-500' : 'bg-slate-300'} transition-all focus:outline-none"></button>`
            ).join('');
        }

        function checkCurrentDayAndDisable() {
            const now = new Date();
            const currentDayOfWeek = now.getDay();
            
            const daysUntilFriday = (5 - currentDayOfWeek + 7) % 7 || 7; 
            
            const targetFriday = new Date(now);
            targetFriday.setDate(now.getDate() + (currentDayOfWeek === 5 ? 0 : daysUntilFriday));
            
            const targetSaturday = new Date(targetFriday);
            targetSaturday.setDate(targetFriday.getDate() + 1);

            const friDeadline = new Date(targetFriday.getFullYear(), targetFriday.getMonth(), targetFriday.getDate() - 1, 20, 0, 0);
            const satDeadline = new Date(targetSaturday.getFullYear(), targetSaturday.getMonth(), targetSaturday.getDate() - 1, 20, 0, 0);

            const friDateStr = `${targetFriday.getMonth() + 1}月${targetFriday.getDate()}日`;
            const satDateStr = `${targetSaturday.getMonth() + 1}月${targetSaturday.getDate()}日`;

            const optFriday = document.getElementById('optFriday');
            const optSaturday = document.getElementById('optSaturday');
            const daySelect = document.getElementById('day');

            // 周五逻辑
            if (!ENABLE_FRI_DINNER) {
                optFriday.disabled = true;
                optFriday.innerText = `星期五 (${friDateStr}) - 暂停预订`;
            } else if (now >= friDeadline) {
                optFriday.disabled = true;
                optFriday.innerText = `星期五 (${friDateStr}) - ${FRI_MENU_NAME} [已截单]`;
            } else {
                optFriday.disabled = false;
                optFriday.innerText = `星期五 (${friDateStr}) - ${FRI_MENU_NAME}`;
            }

            // 周六逻辑
            const isSatAvailable = ENABLE_SAT_DINNER || ENABLE_SAT_DESSERT;
            if (!isSatAvailable) {
                optSaturday.disabled = true;
                optSaturday.innerText = `星期六 (${satDateStr}) - 暂停预订`;
            } else if (now >= satDeadline) {
                optSaturday.disabled = true;
                let text = `星期六 (${satDateStr}) - `;
                let items = [];
                if (ENABLE_SAT_DINNER) items.push(SAT_MENU_NAME);
                if (ENABLE_SAT_DESSERT) items.push(SAT_DESSERT_NAME);
                optSaturday.innerText = text + items.join(" / ") + " [已截单]";
            } else {
                optSaturday.disabled = false;
                let text = `星期六 (${satDateStr}) - `;
                let items = [];
                if (ENABLE_SAT_DINNER) items.push(SAT_MENU_NAME);
                if (ENABLE_SAT_DESSERT) items.push(SAT_DESSERT_NAME);
                optSaturday.innerText = text + items.join(" / ");
            }

            if (optFriday.disabled && !optSaturday.disabled) {
                daySelect.value = "星期六";
            } else if (!optFriday.disabled) {
                daySelect.value = "星期五";
            } else {
                daySelect.value = "星期五";
            }
        }

        function startCarousel() {
            stopCarousel();
            if (SLIDES.length <= 1) return;
            carouselTimer = setInterval(() => {
                slideIndex = (slideIndex + 1) % SLIDES.length;
                showSlide(slideIndex);
            }, 5000);
        }

        function stopCarousel() {
            if (carouselTimer) clearInterval(carouselTimer);
        }

        function goToSlide(index) {
            slideIndex = index;
            showSlide(slideIndex);
            startCarousel();
        }

        function nextSlide() {
            slideIndex = (slideIndex + 1) % SLIDES.length;
            showSlide(slideIndex);
            startCarousel();
        }

        function prevSlide() {
            slideIndex = (slideIndex - 1 + SLIDES.length) % SLIDES.length;
            showSlide(slideIndex);
            startCarousel();
        }

        function showSlide(index) {
            const img = document.getElementById('carouselImage');

            img.style.opacity = '0.3';

            setTimeout(() => {
                const current = SLIDES[index];
                img.src = current.image;

                for (let i = 0; i < SLIDES.length; i++) {
                    const dot = document.getElementById(`dot${i}`);
                    if (dot) {
                        dot.className = (i === index) 
                            ? "w-2 h-2 rounded-full bg-amber-500 transition-all focus:outline-none" 
                            : "w-2 h-2 rounded-full bg-slate-300 transition-all focus:outline-none";
                    }
                }
                img.style.opacity = '1';
            }, 200);
        }

        function initSwipeEvents() {
            const container = document.getElementById('carouselContainer');

            container.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            container.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            let isDragging = false;
            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                touchStartX = e.screenX;
            });

            container.addEventListener('mouseup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                touchEndX = e.screenX;
                handleSwipe();
            });
        }

        function handleSwipe() {
            const threshold = 40;
            if (touchStartX - touchEndX > threshold) {
                nextSlide();
            } else if (touchEndX - touchStartX > threshold) {
                prevSlide();
            }
        }

        function updateMenuInfo() {
            const day = document.getElementById('day').value;
            const menuIcon = document.getElementById('menuIcon');
            const menuText = document.getElementById('menuText');
            const mainDishSection = document.getElementById('mainDishSection');
            const dessertSection = document.getElementById('dessertSection');
            const mainDishToggle = document.getElementById('mainDishToggle');
            const wantMainDish = document.getElementById('wantMainDish');

            if (day === "星期五") {
                if (ENABLE_FRI_DINNER) {
                    mainDishSection.classList.remove('hidden');
                    menuIcon.innerText = "🍲";
                    menuText.innerText = `${FRI_MENU_NAME} (RM ${FRI_MAIN_PRICE}.00 / 份)`;
                    mainDishToggle.classList.add('hidden');
                    wantMainDish.checked = true;
                    document.getElementById('mainQtyContainer').classList.remove('hidden');
                } else {
                    mainDishSection.classList.add('hidden');
                    wantMainDish.checked = false;
                }
                
                dessertSection.classList.add('hidden');
                document.getElementById('wantDessert').checked = false;
                document.getElementById('dessertQtyContainer').classList.add('hidden');

            } else { // 星期六
                if (ENABLE_SAT_DINNER) {
                    mainDishSection.classList.remove('hidden');
                    menuIcon.innerText = "🍲";
                    menuText.innerText = `${SAT_MENU_NAME} (RM ${SAT_MAIN_PRICE}.00 / 份)`;
                    
                    if (ENABLE_SAT_DESSERT) {
                        mainDishToggle.classList.remove('hidden');
                    } else {
                        mainDishToggle.classList.add('hidden');
                        wantMainDish.checked = true;
                        document.getElementById('mainQtyContainer').classList.remove('hidden');
                    }
                } else {
                    mainDishSection.classList.add('hidden');
                    wantMainDish.checked = false;
                }

                if (ENABLE_SAT_DESSERT) {
                    dessertSection.classList.remove('hidden');
                    document.getElementById('dessertTitleText').innerText = `${SAT_DESSERT_NAME}（RM ${DESSERT_PRICE}.00 / 份）`;
                    document.getElementById('dessertUnitPriceText').innerText = `+ RM ${DESSERT_PRICE}.00 / 份`;
                    if (!ENABLE_SAT_DINNER) {
                        document.getElementById('wantDessert').checked = true;
                        document.getElementById('dessertQtyContainer').classList.remove('hidden');
                    }
                } else {
                    dessertSection.classList.add('hidden');
                    document.getElementById('wantDessert').checked = false;
                    document.getElementById('dessertQtyContainer').classList.add('hidden');
                }
            }
            calculateTotal();
        }

        function toggleMainDish() {
            const wantMainDish = document.getElementById('wantMainDish').checked;
            const container = document.getElementById('mainQtyContainer');
            if (wantMainDish) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
            calculateTotal();
        }

        function adjustQty(amount) {
            const qtyInput = document.getElementById('qty');
            let current = parseInt(qtyInput.value) || 1;
            current += amount;
            if (current < 1) current = 1;
            qtyInput.value = current;
            calculateTotal();
        }

        function toggleDessertQty() {
            const wantDessert = document.getElementById('wantDessert').checked;
            const container = document.getElementById('dessertQtyContainer');
            if (wantDessert) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
            calculateTotal();
        }

        function adjustDessertQty(amount) {
            const qtyInput = document.getElementById('dessertQty');
            let current = parseInt(qtyInput.value) || 1;
            current += amount;
            if (current < 1) current = 1;
            if (current > 20) current = 20;
            qtyInput.value = current;
            calculateTotal();
        }

        function calculateTotal() {
            const day = document.getElementById('day').value;
            const wantMainDish = document.getElementById('wantMainDish').checked;
            const mainQty = parseInt(document.getElementById('qty').value) || 1;
            const wantDessert = document.getElementById('wantDessert').checked;
            const dessertQty = parseInt(document.getElementById('dessertQty').value) || 1;

            let total = 0;

            if (wantMainDish) {
                if (day === "星期五" && ENABLE_FRI_DINNER) {
                    total += mainQty * FRI_MAIN_PRICE;
                } else if (day === "星期六" && ENABLE_SAT_DINNER) {
                    total += mainQty * SAT_MAIN_PRICE;
                }
            }

            if (day === "星期六" && ENABLE_SAT_DESSERT && wantDessert) {
                total += dessertQty * DESSERT_PRICE;
            }

            currentTotal = total.toFixed(2);

            document.getElementById('totalText').innerText = `RM ${currentTotal}`;
            document.getElementById('qrAmountText').innerText = `RM ${currentTotal}`;
            document.getElementById('copyAmountText').innerText = `复制转账金额 (${currentTotal})`;
        }

        function safeCopyText(text, successCallback) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(successCallback).catch(() => fallbackCopy(text, successCallback));
            } else {
                fallbackCopy(text, successCallback);
            }
        }

        function fallbackCopy(text, successCallback) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                successCallback();
            } catch (err) {
                alert("复制失败，请手动复制：" + text);
            }
            document.body.removeChild(textArea);
        }

        function copyAmount() {
            safeCopyText(currentTotal, () => {
                const span = document.getElementById('copyAmountText');
                const originalText = span.innerText;
                span.innerText = `✅ 已复制金额 RM ${currentTotal}！`;
                setTimeout(() => { span.innerText = originalText; }, 2500);
            });
        }

        function copyPhone() {
            safeCopyText(DUITNOW_PHONE, () => {
                const span = document.getElementById('copyPhoneText');
                const originalText = span.innerText;
                span.innerText = `✅ 已复制号码 ${DUITNOW_PHONE}！`;
                setTimeout(() => { span.innerText = originalText; }, 2500);
            });
        }

        async function handleOrder(event) {
            event.preventDefault();

            const day = document.getElementById('day').value;
            const wantMainDish = document.getElementById('wantMainDish').checked;
            const wantDessert = document.getElementById('wantDessert').checked;

            const isMainAvailable = (day === "星期五" && ENABLE_FRI_DINNER) || (day === "星期六" && ENABLE_SAT_DINNER);
            const isDessertAvailable = (day === "星期六" && ENABLE_SAT_DESSERT);

            const mainQty = (isMainAvailable && wantMainDish) ? (parseInt(document.getElementById('qty').value) || 0) : 0;
            const dessertQty = (isDessertAvailable && wantDessert) ? (parseInt(document.getElementById('dessertQty').value) || 0) : 0;

            if ((!wantMainDish || mainQty <= 0) && (!wantDessert || dessertQty <= 0)) {
                alert("⚠️ 请至少选择 1 份主餐或糖水！");
                return;
            }

            const btn = document.getElementById('submitBtn');
            const originalBtnText = `<i class="fa-brands fa-whatsapp text-white text-2xl"></i><span>确认提交并发送至 WhatsApp</span>`;
            
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-white"></i><span>正在提交订单...</span>`;

            const name = document.getElementById('name').value.trim();
            const notes = document.getElementById('notes').value.trim() || '无';
            const total = currentTotal;

            const dishName = (day === "星期五") ? FRI_MENU_NAME : SAT_MENU_NAME;
            const qtySummary = `主餐:${mainQty} | 糖水:${dessertQty}`;

            const payload = { 
                timestamp: new Date().toLocaleString("zh-CN", { timeZone: "Asia/Kuala_Lumpur" }),
                name: name, 
                day: day, 
                quantity: qtySummary,
                total: total, 
                notes: notes 
            };

            if (GOOGLE_SCRIPT_URL) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                } catch (e) {
                    console.log("Sheet fetch skipped or timed out:", e);
                } finally {
                    clearTimeout(timeoutId);
                }
            }

            let waMessage = `🛒 *【晚餐/糖水预订订单】*%0A` +
                            `--------------------------------%0A` +
                            `👤 *名字*：${encodeURIComponent(name)}%0A` +
                            `📅 *用餐日期*：${encodeURIComponent(day)}%0A`;

            if (isMainAvailable && wantMainDish && mainQty > 0) {
                waMessage += `🍲 *主餐*：${encodeURIComponent(dishName)} x ${mainQty} 份%0A`;
            }
            if (isDessertAvailable && wantDessert && dessertQty > 0) {
                waMessage += `🥣 *糖水*：${encodeURIComponent(SAT_DESSERT_NAME)} x ${dessertQty} 份%0A`;
            }

            waMessage += `💰 *总计*：RM ${total}%0A` +
                         `📝 *备注*：${encodeURIComponent(notes)}%0A` +
                         `--------------------------------%0A` +
                         `已下单，已按照 RM ${total} 完成转账/准备付款，请查收！`;

            const waUrl = `https://wa.me/${MY_PHONE_NUMBER}?text=${waMessage}`;

            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = originalBtnText;
                window.open(waUrl, '_blank');
            }, 300);
        }
    </script>
</body>
