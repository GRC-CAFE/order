<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周五/周六晚餐预订</title>
    <!-- 引入 Tailwind CSS 打造精美界面 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <!-- 顶部 Banner 照片 -->
    <div class="relative h-64 w-full max-w-md mx-auto">
        <img src="https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=80" 
             class="w-full h-full object-cover rounded-b-3xl shadow-md" alt="晚餐美食">
        <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent rounded-b-3xl"></div>
        <div class="absolute bottom-4 left-5 right-5 text-white">
            <span class="bg-amber-500 text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wide">本周招牌</span>
            <h1 class="text-2xl font-extrabold mt-1">🍱 秘制招牌猪脚饭</h1>
            <p class="text-slate-200 text-sm mt-0.5">每周五 / 周六限量供应，请提前预订</p>
        </div>
    </div>

    <!-- 表单卡片 -->
    <div class="max-w-md mx-auto px-4 -mt-4 relative z-10 space-y-5">
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100 space-y-5">
            
            <!-- 价格与简单说明 -->
            <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <div>
                    <span class="text-xs text-slate-400 block">单价</span>
                    <span class="text-2xl font-black text-rose-600">RM 13.00 <span class="text-xs font-normal text-slate-500">/ 份</span></span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 block">截单时间</span>
                    <span class="text-xs font-semibold bg-slate-100 text-slate-700 px-2 py-1 rounded-md">每周四 8:00 PM</span>
                </div>
            </div>

            <!-- 表单输入区 -->
            <form id="orderForm" onsubmit="handleOrder(event)" class="space-y-4">
                
                <!-- 姓名 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">您的名字 / 称呼 <span class="text-rose-500">*</span></label>
                    <input type="text" id="name" required placeholder="例如：Tan / Ah Beng" 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                </div>

                <!-- 预订日期 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">预订用餐日期 <span class="text-rose-500">*</span></label>
                    <select id="day" required class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                        <option value="星期五">星期五晚餐 (Friday)</option>
                        <option value="星期六">星期六晚餐 (Saturday)</option>
                    </select>
                </div>

                <!-- 份数加减器 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">预订份数 <span class="text-rose-500">*</span></label>
                    <div class="flex items-center space-x-3">
                        <button type="button" onclick="adjustQty(-1)" class="w-12 h-12 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xl flex items-center justify-center border border-slate-200">-</button>
                        <input type="number" id="qty" value="1" min="1" readonly class="w-full text-center py-3 font-bold text-lg border border-slate-200 rounded-xl bg-slate-50">
                        <button type="button" onclick="adjustQty(1)" class="w-12 h-12 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xl flex items-center justify-center border border-slate-200">+</button>
                    </div>
                </div>

                <!-- 备注 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">特殊备注 (可选)</label>
                    <input type="text" id="notes" placeholder="如：少饭 / 加辣 / 不要葱" 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                </div>

                <!-- 总价预览与提交按钮 -->
                <div class="pt-2">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-sm font-bold text-slate-600">预估总额：</span>
                        <span id="totalText" class="text-xl font-extrabold text-emerald-600">RM 13.00</span>
                    </div>

                    <button type="submit" id="submitBtn" 
                            class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-[0.99] text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-500/30 flex items-center justify-center space-x-2 transition">
                        <i class="fa-brands fa-whatsapp text-xl"></i>
                        <span>确认提交并发送至 WhatsApp</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- 动态金额 DuitNow 付款 QR Code 卡片 -->
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100 text-center space-y-3">
            <h2 class="text-lg font-bold text-slate-800 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-qrcode text-pink-600"></i>
                <span>DuitNow QR 付款（包含动态金额）</span>
            </h2>
            <p class="text-xs text-slate-500">使用任何银行 App / TNG eWallet 扫描下方二维码付款：</p>
            
            <!-- 动态二维码图片容器 -->
            <div class="relative w-56 h-56 mx-auto bg-slate-50 rounded-xl border-2 border-dashed border-slate-200 p-2 flex items-center justify-center">
                <img id="qrImage" src="" class="w-full h-full object-contain rounded-lg shadow-sm" alt="DuitNow 付款 QR 码">
            </div>

            <div class="bg-slate-50 p-3 rounded-xl">
                <p class="text-xs text-slate-400">应付总额：</p>
                <p id="qrAmountText" class="text-lg font-black text-rose-600">RM 13.00</p>
            </div>
            <p class="text-xs text-slate-400">💡 扫码后金额会自动填好，付款后点击上方按钮跳转 WhatsApp</p>
        </div>

        <p class="text-center text-xs text-slate-400 mt-6">提交后将自动跳转至 WhatsApp 发送订单凭证</p>
    </div>

    <script>
        // ⚙️ 参数设置：
        const PRICE_PER_UNIT = 13; // 单价 (RM)
        const MY_PHONE_NUMBER = "60145952975"; // 💡 换成你的 WhatsApp 电话（带国家码，不要加 + 号）
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwb8DekyobGj28he2BCQhcyHtqiN_vJvC8YvTNkuM4Wr-oi8PBdJ50PCy5abuwTvcujMg/exec"; // 💡 粘贴你的 Google Apps Script URL
        
        // 💡 换成绑了 DuitNow 的手机号码（格式：601XXXXXXXX，例如 60123456789）
        const DUITNOW_ID = "60145952975"; 
        const MERCHANT_NAME = "DINNER ORDER"; // 收款人名称或店铺名（英文字母）

        // --- DuitNow (EMVCo Standard) QR 生成引擎 ---
        function generateDuitNowQRPayload(duitnowId, amountStr) {
            function formatField(id, val) {
                const len = val.length.toString().padStart(2, '0');
                return id + len + val;
            }

            // 格式化金额 (例如 13.00)
            const formattedAmount = parseFloat(amountStr).toFixed(2);

            // 构建 DuitNow 子节点 (Tag 26)
            // 00: Reverse Domain (my.com.paynet)
            // 01: DuitNow Mobile Number / Account (11: Mobile Number Proxy)
            const sub26 = formatField('00', 'my.com.paynet') + 
                          formatField('01', duitnowId);

            let payload = "";
            payload += formatField('00', '01'); // Payload Format Indicator
            payload += formatField('01', '12'); // Dynamic QR Code (12)
            payload += formatField('26', sub26); // Merchant Account Info
            payload += formatField('52', '0000'); // Merchant Category Code
            payload += formatField('53', '458'); // Currency Code (458 = MYR)
            payload += formatField('54', formattedAmount); // Transaction Amount
            payload += formatField('58', 'MY'); // Country Code
            payload += formatField('59', MERCHANT_NAME); // Merchant Name
            payload += formatField('60', 'KUALA LUMPUR'); // Merchant City
            payload += '6304'; // CRC16 Header

            // 计算 CRC16-CCITT (FFFF)
            function crc16(str) {
                let crc = 0xFFFF;
                for (let i = 0; i < str.length; i++) {
                    crc ^= str.charCodeAt(i) << 8;
                    for (let j = 0; j < 8; j++) {
                        if ((crc & 0x8000) !== 0) {
                            crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
                        } else {
                            crc = (crc << 1) & 0xFFFF;
                        }
                    }
                }
                return crc.toString(16).toUpperCase().padStart(4, '0');
            }

            return payload + crc16(payload);
        }

        function adjustQty(amount) {
            const qtyInput = document.getElementById('qty');
            let current = parseInt(qtyInput.value) || 1;
            current += amount;
            if (current < 1) current = 1;
            qtyInput.value = current;
            updateTotal();
        }

        function updateTotal() {
            const qty = parseInt(document.getElementById('qty').value) || 1;
            const total = (qty * PRICE_PER_UNIT).toFixed(2);
            
            // 1. 更新页面文本中的总价
            document.getElementById('totalText').innerText = `RM ${total}`;
            document.getElementById('qrAmountText').innerText = `RM ${total}`;

            // 2. 动态生成符合标准的 DuitNow 电子支付字符串
            const duitnowPayload = generateDuitNowQRPayload(DUITNOW_ID, total);
            
            // 3. 将符合标准的 DuitNow Payload 渲染成二维码
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(duitnowPayload)}`;
            document.getElementById('qrImage').src = qrUrl;
        }

        // 初始化运行一次
        updateTotal();

        async function handleOrder(event) {
            event.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span>正在保存订单...</span>`;

            const name = document.getElementById('name').value;
            const day = document.getElementById('day').value;
            const qty = document.getElementById('qty').value;
            const notes = document.getElementById('notes').value || '无';
            const total = (qty * PRICE_PER_UNIT).toFixed(2);

            const payload = { name, day, qty, total, notes };

            // 1. 静默写入 Google Sheets 后台
            if (GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes("YOUR_GOOGLE")) {
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) {
                    console.log("Sheet error:", e);
                }
            }

            // 2. 拼装 WhatsApp 消息文本
            const waMessage = `🛒 *【晚餐预订订单】*%0A` +
                              `--------------------------------%0A` +
                              `👤 *名字*：${name}%0A` +
                              `📅 *用餐日期*：${day}%0A` +
                              `🍲 *餐点*：招牌猪脚饭 x ${qty} 份%0A` +
                              `💰 *总计*：RM ${total}%0A` +
                              `📝 *备注*：${notes}%0A` +
                              `--------------------------------%0A` +
                              `已下单，已按照 RM ${total} 完成转账/准备付款，请查收！`;

            // 3. 打开 WhatsApp 页面
            window.location.href = `https://wa.me/${MY_PHONE_NUMBER}?text=${waMessage}`;
        }
    </script>
</body>
</html>
